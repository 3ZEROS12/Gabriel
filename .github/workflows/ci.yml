name: Gabriel CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements.txt
        
    - name: Run Ruff Linter
      run: |
        ruff check src tests

    - name: Run Test Suite
      env:
        PYTHONUTF8: "1"
      run: |
        python -m pytest tests/ -q

  stability-smoke:
    needs: test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil
        pip install -r requirements.txt
        
    - name: Run Stability Smoke Test (15 mins)
      env:
        PYTHONUTF8: "1"
      run: |
        python scripts/stability_run.py --hours 0.25

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Build Tools
      run: |
        pip install pyinstaller fastapi uvicorn openai httpx
        
    - name: Build Standalone Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "static;static" --add-data "src;src" src/main.py --name "Gabriel_Agent_OS"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gabriel-Windows-Build
        path: dist/Gabriel_Agent_OS/
