<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel | Awakening Sidecar</title>
<style>
  :root {
      --bg-apple: #f5f5f7;
      --card-apple: rgba(255, 255, 255, 0.78);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --accent-apple: #0066cc;
      --hairline: rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; }
  body { 
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f5f5f7 100%); 
      color: var(--text-main); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; 
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
  }
  .splash-container {
      text-align: center;
      width: 420px;
      padding: 44px 36px 36px 36px;
      background: var(--card-apple);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
      animation: appleFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes appleFadeOut {
      from { opacity: 1; transform: scale(1) translateY(0); }
      to { opacity: 0; transform: scale(1.03) translateY(-8px); }
  }
  .splash-container.exit-anim {
      animation: appleFadeOut 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  /* Spacious unconstrained hero bouquet frame */
  .rose-hero-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px;
  }
  .rose-hero-img {
      width: 240px;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 16px 36px rgba(99, 102, 241, 0.18));
      animation: floatBouquet 4s ease-in-out infinite;
  }
  @keyframes floatBouquet {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
  }
  .brand-title { 
      font-size: 1.5rem; 
      letter-spacing: 6px; 
      font-weight: 600; 
      color: var(--text-main); 
      margin-bottom: 6px;
  }
  .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 400;
      letter-spacing: 0.2px;
      margin-bottom: 24px;
  }
  .loader-track {
      width: 160px;
      height: 4px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      margin: 0 auto 14px auto;
      overflow: hidden;
      position: relative;
  }
  .loader-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 4px;
      position: absolute;
      animation: pulseTrack 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transition: width 0.4s ease;
  }
  .loader-fill.ready {
      width: 100% !important;
      left: 0 !important;
      animation: none !important;
      background: #10b981;
  }
  @keyframes pulseTrack {
      0% { left: -45%; }
      100% { left: 100%; }
  }
  .status-text {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "JetBrains Mono", monospace;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
  }
</style>
</head>
<body>
<div class="splash-container" id="splashBox">
    <div class="rose-hero-wrapper">
        <img src="/static/assets/rose_sprites_final/01_big_bouquet.png" alt="Gabriel Rose Bouquet" class="rose-hero-img">
    </div>
    <div class="brand-title">G A B R I E L</div>
    <div class="brand-subtitle">Sidecar Agent for Autonomous Coding</div>
    <div class="loader-track">
        <div class="loader-fill" id="loaderFill"></div>
    </div>
    <div class="status-text" id="statusMsg">Awakening Gabriel Side-Brain...</div>
</div>
<script>
    const startTime = Date.now();
    const minDisplayMs = 1800; // Graceful 1.8s awakening ritual

    const checkServer = () => {
        fetch('/api/ping')
        .then(r => r.json())
        .then(data => { 
            if(data && data.status === 'ok') {
                if (data.token) {
                    localStorage.setItem('gabriel_token', data.token);
                }

                // Stage 2 message
                setTimeout(() => {
                    document.getElementById('statusMsg').innerText = "Connecting Local Neural Radar...";
                }, 600);

                // Stage 3 message + completion
                setTimeout(() => {
                    document.getElementById('statusMsg').innerText = "System Ready. Welcome, Creator.";
                    document.getElementById('loaderFill').classList.add('ready');
                }, 1300);

                // Calculate remaining delay to honor 1.8s graceful viewing
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, minDisplayMs - elapsed);

                setTimeout(() => {
                    const box = document.getElementById('splashBox');
                    if (box) box.classList.add('exit-anim');
                    setTimeout(() => {
                        window.location.replace('/?token=' + encodeURIComponent(data.token || ''));
                    }, 350);
                }, remaining);
            } else {
                setTimeout(checkServer, 200);
            }
        })
        .catch(e => {
            setTimeout(checkServer, 200);
        });
    };
    checkServer();
</script>
</body>
</html>
