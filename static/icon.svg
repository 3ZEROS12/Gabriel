<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Indigo gradient for the terminal spark/cursor (v4 Light Indigo) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#533AFD" />
      <stop offset="100%" stop-color="#2E2B8C" />
    </linearGradient>
    
    <!-- Ethereal silver/white gradient for Gabriel's feather -->
    <linearGradient id="featherGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glow effect for the gold spark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop shadow for the feather to give depth against white background -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background (Optional, left transparent so it looks good on any dock/taskbar) -->
  <rect width="512" height="512" rx="112" fill="#FAFAFA" />
  
  <!-- Glowing Golden Terminal Cursor (The Creator / Main Agent) -->
  <g filter="url(#glow)">
    <path d="M 120 160 L 260 256 L 120 352" fill="none" stroke="url(#goldGradient)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="280" y1="360" x2="400" y2="360" stroke="url(#goldGradient)" stroke-width="32" stroke-linecap="round" />
  </g>

  <!-- Divine White Feather (Gabriel / The Assistant) -->
  <path 
    d="M 420 90 C 380 70 300 110 240 180 C 180 250 140 330 110 400 C 100 425 130 430 150 410 C 170 390 190 350 210 320 C 230 350 250 360 280 340 C 270 310 260 280 265 250 C 295 270 325 275 350 255 C 330 220 310 190 325 160 C 360 170 390 170 410 145 C 400 120 390 110 420 90 Z" 
    fill="url(#featherGradient)" 
    filter="url(#shadow)" 
  />
  
  <!-- Subtle detail lines inside the feather for realism -->
  <path d="M 115 400 Q 250 250 405 105" fill="none" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
</svg>
